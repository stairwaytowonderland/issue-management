name: Create Labels

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run'
        type: boolean
        default: true
      update-existing:
        description: 'Whether to update existing labels (e.g. rename, change color/description).'
        type: boolean

  workflow_run:
    workflows: ['_']
    types: [completed]

jobs:
  debug-info:
    name: Debug Info
    runs-on: ubuntu-latest
    steps:
      - name: Print event info
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Workflow Run Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Dry Run: ${{ inputs.dry-run }}"
          echo "Update Existing: ${{ inputs.update-existing }}"
  create-labels:
    name: Create Labels
    # if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: stairwaytowonderland/label-management/.github/workflows/create-labels.yaml@v1
    secrets: inherit
    with:
      dry-run: ${{ inputs.dry-run == true || github.event.workflow_run.conclusion != 'success' }}
      update-existing: ${{ inputs.update-existing == true }}
